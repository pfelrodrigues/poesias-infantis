name: verify-book

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Verify sources, bilingual library and EPUBs
        run: |
          make test
          make book
      - name: Validate EPUB with EPUBCheck 5.3.0
        run: |
          mkdir -p build
          curl --fail --location --retry 2 --output build/epubcheck.zip https://github.com/w3c/epubcheck/releases/download/v5.3.0/epubcheck-5.3.0.zip
          echo '6c07e68584b2e2ce2f89fe06e1246dfead3eb36b46b340e7d93524f29dcff6c5  build/epubcheck.zip' | sha256sum --check
          unzip -q build/epubcheck.zip -d build
          for epub in web/.editions/*/*/*.epub; do
            java -jar build/epubcheck-5.3.0/epubcheck.jar "$epub"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: books-verified-site
          path: site
          if-no-files-found: error
