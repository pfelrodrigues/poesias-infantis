[tools]
python = "3.12.13"
uv = "0.11.21"
pandoc = "3.7.0.2"
hugo = "0.163.3"
node = "22.22.0"

[env]
_.python.venv = { path = ".venv", create = true }

[tasks.build]
description = "Gera a biblioteca completa e os EPUBs"
run = "make book"

[tasks.test]
description = "Verifica fontes, edições e biblioteca PT/EN"
run = "make test"
